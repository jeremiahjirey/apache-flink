<!DOCTYPE html>
<html>
<head>
  <title>Live Tweets Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background-color: #f2f2f2; }
    canvas { max-width: 600px; margin-top: 30px; }
  </style>
</head>
<body>
  <h1>Live Tweets Dashboard</h1>

  <canvas id="tweetChart"></canvas>

  <table>
    <tr>
      <th>Username</th>
      <th>Message</th>
      <th>Location</th>
      <th>Timestamp</th>
    </tr>
    {% for tweet in tweets %}
    <tr>
      <td>{{ tweet.username }}</td>
      <td>{{ tweet.message }}</td>
      <td>{{ tweet.location }}</td>
      <td>{{ tweet.timestamp }}</td>
    </tr>
    {% endfor %}
  </table>

  <script>
    const ctx = document.getElementById('tweetChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: {{ chart_data.labels | tojson }},
        datasets: [{
          label: 'Tweet Count per User',
          data: {{ chart_data.values | tojson }},
          backgroundColor: 'rgba(54, 162, 235, 0.6)',
          borderColor: 'rgba(54, 162, 235, 1)',
          borderWidth: 1
        }]
      },
      options: { scales: { y: { beginAtZero: true } } }
    });
  </script>
</body>
</html>
